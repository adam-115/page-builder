@if(showDialog){

<div
    class="fixed inset-0 dialog-overlay overflow-y-auto h-full w-full z-50 bg-gray-50 opacity-96 **backdrop-blur-sm**">

    <div
        class="relative top-10 mx-auto p-6 border w-11/12 md:w-3/4 lg:w-3/5 xl:w-1/2 shadow-2xl rounded-lg bg-white transform transition-all duration-300 ease-out">

        <div class="flex justify-between items-center pb-4 mb-4 border-b border-gray-200">
            <h3 class="text-2xl font-bold text-indigo-700">
                {{ fieldConfig.id ? 'Modifier la Configuration du Champ' : 'Créer un Nouveau Champ AML' }}
            </h3>
            <button (click)="onClose()" class="text-gray-500 hover:text-gray-900 transition">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

        <form [formGroup]="amlForm" (ngSubmit)="onSubmit()" class="space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                <div>
                    <label for="type" class="block text-sm font-medium text-gray-700">Type de Champ (*)</label>
                    <select id="type" formControlName="type"
                        class="form-select mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2">
                        <option *ngFor="let type of availableTypes" [value]="type">{{ type | uppercase }}</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label for="name" class="block text-sm font-medium text-gray-700">Nom Technique (name) (*)</label>
                    <input type="text" id="name" formControlName="name" placeholder="Ex: document_identite"
                        class="form-input mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2"
                        [ngClass]="{'border-red-500': amlForm.get('name')?.invalid && amlForm.get('name')?.touched}" />
                </div>
            </div>

            <div>
                <label for="labelMessage" class="block text-sm font-medium text-gray-700">Label/Question affichée au
                    client
                    (*)</label>
                <input type="text" id="labelMessage" formControlName="labelMessage"
                    placeholder="Ex: Veuillez télécharger votre preuve d'identité."
                    class="form-input mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2"
                    [ngClass]="{'border-red-500': amlForm.get('labelMessage')?.invalid && amlForm.get('labelMessage')?.touched}" />
            </div>


            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 bg-indigo-50 p-4 rounded-md">

                <div class="col-span-2 md:col-span-1">
                    <label for="facteur" class="block text-sm font-medium text-gray-700">Facteur de Risque (*)</label>
                    <input type="number" id="facteur" formControlName="facteur" min="0"
                        class="form-input mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2" />
                    <p class="text-xs text-gray-500 mt-1">Poids du champ dans le calcul global du risque.</p>
                </div>

                <div class="hidden md:block">
                </div>

                <div class="flex items-center pt-5">
                    <input id="required" type="checkbox" formControlName="required"
                        class="h-5 w-5 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                    <label for="required" class="ml-2 block text-sm font-medium text-gray-700 select-none">
                        Champ Requis (Obligatoire)
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="placeholder" class="block text-sm font-medium text-gray-700">Placeholder (texte
                        d'aide)</label>
                    <input type="text" id="placeholder" formControlName="placeholder"
                        class="form-input mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2" />
                </div>
                <div>
                    <label for="errorMessage" class="block text-sm font-medium text-gray-700">Message d'Erreur
                        Personnalisé</label>
                    <input type="text" id="errorMessage" formControlName="errorMessage"
                        class="form-input mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2" />
                </div>
            </div>

            <div *ngIf="optionRequiredTypes.includes(amlForm.get('type')?.value)" class="bg-gray-100 p-4 rounded-md">
                <h4 class="text-lg font-bold text-gray-800 mb-3 flex justify-between items-center">
                    Configuration des Options & Scores Associés
                    <div class="flex items-center space-x-3">

                        <label for="fileUploadOptions"
                            class="cursor-pointer text-sm px-3 py-1 border border-gray-400 rounded-md text-gray-700 bg-white hover:bg-gray-50 font-medium transition duration-150">
                            <svg class="w-4 h-4 inline-block mr-1 -mt-0.5" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                            </svg>
                            Importer Fichier
                            <input type="file" id="fileUploadOptions" accept=".csv, .json, .txt"
                                (change)="handleFileSelect($event)" class="hidden" />
                        </label>

                        <button type="button" (click)="addOption()"
                            class="text-sm px-3 py-1 border border-indigo-600 rounded-md text-white bg-indigo-600 hover:bg-indigo-700 font-medium transition duration-150">
                            + Ajouter une Option
                        </button>

                    </div>
                </h4>

                <div
                    class="grid grid-cols-6 gap-2 text-sm font-semibold text-gray-600 mb-2 border-b border-gray-300 pb-1">
                    <div class="col-span-4">Valeur de l'Option (*)</div>
                    <div class="col-span-1 text-center">Score (*)</div>
                    <div class="col-span-1 text-right">Action</div>
                </div>

                <div formArrayName="options" class="space-y-3">
                    <div *ngFor="let optionGroup of options.controls; let i = index" [formGroupName]="i"
                        class="grid grid-cols-6 gap-2 items-center">
                        <div class="col-span-4">
                            <input formControlName="value" type="text"
                                placeholder="Ex: Pays à faible risque / Pays à haut risque"
                                class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 text-sm"
                                [ngClass]="{'border-red-500': optionGroup.get('value')?.invalid && optionGroup.get('value')?.touched}" />
                        </div>

                        <div class="col-span-1">
                            <input formControlName="score" type="number" min="0" placeholder="Score"
                                class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 text-sm text-center"
                                [ngClass]="{'border-red-500': optionGroup.get('score')?.invalid && optionGroup.get('score')?.touched}" />
                        </div>

                        <div class="col-span-1 text-right">
                            <button type="button" (click)="removeOption(i)"
                                [disabled]="options.length === 1 && optionRequiredTypes.includes(amlForm.get('type')?.value)"
                                class="text-red-600 hover:text-red-800 p-2 disabled:opacity-30 transition duration-150">
                                <svg class="h-5 w-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div *ngIf="amlForm.get('type')?.value !== 'select'" class="mt-4 pt-4 border-t border-gray-200">
                    <label class="block text-sm font-medium text-gray-700">Disposition des options affichées:</label>
                    <div class="mt-2 space-x-6">
                        <label class="inline-flex items-center">
                            <input type="radio" formControlName="optionsLayout" value="block"
                                class="form-radio text-indigo-600 h-4 w-4">
                            <span class="ml-2 text-sm text-gray-700">Bloc (vertical)</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" formControlName="optionsLayout" value="inline"
                                class="form-radio text-indigo-600 h-4 w-4">
                            <span class="ml-2 text-sm text-gray-700">En ligne (horizontal)</span>
                        </label>
                    </div>
                </div>
            </div>


            <div class="pt-4 border-t border-gray-200 flex justify-end space-x-3">
                <button type="button" (click)="onClose()"
                    class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-100 transition duration-150">
                    Annuler
                </button>
                <button type="submit" [disabled]="amlForm.invalid"
                    class="px-4 py-2 border border-transparent rounded-lg text-sm font-medium text-white shadow-sm bg-indigo-600 hover:bg-indigo-700 transition duration-150 disabled:opacity-50">
                    Enregistrer le Champ
                </button>
            </div>

        </form>
    </div>
</div>

}
