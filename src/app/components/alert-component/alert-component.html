<div *ngIf="isOpen"
  class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-opacity">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md transform transition-all scale-100 overflow-hidden">

    <div class="p-6">
      <div class="flex items-start space-x-4">
        <div [ngClass]="getStyles().iconBg"
          class="flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center">
          <svg *ngIf="alertConfig.type === 'error' || alertConfig.type === 'warning'" [ngClass]="getStyles().iconColor"
            class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
            </path>
          </svg>
          <svg *ngIf="alertConfig.type === 'info' || alertConfig.type === 'success'" [ngClass]="getStyles().iconColor"
            class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0116 0z"></path>
          </svg>
        </div>

        <div class="flex-1">
          <h3 class="text-xl font-bold text-gray-900 leading-6">{{ alertConfig.title }}</h3>
          <div class="mt-2">
            <p class="text-sm text-gray-500">{{ alertConfig.message }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-gray-50 px-6 py-4 flex flex-row-reverse gap-3">
      <button (click)="confirm()" [ngClass]="getStyles().btn"
        class="px-5 py-2.5 rounded-xl text-white text-sm font-bold shadow-sm transition-all active:scale-95">
        {{ alertConfig.confirmText }}
      </button>

      <button *ngIf="alertConfig.type === 'confirm' || alertConfig.type === 'warning'" (click)="close()"
        class="px-5 py-2.5 rounded-xl border border-gray-300 bg-white text-gray-700 text-sm font-semibold hover:bg-gray-100 transition-all">
        {{ alertConfig.cancelText }}
      </button>
    </div>
  </div>
</div>
