<div class="min-h-screen bg-gray-50 py-2 px-4">
  <div class="max-w-3xl mx-auto">
    <form [formGroup]="pageForm" (submit)="onSubmit()" class="bg-white rounded-2xl shadow-lg overflow-hidden">

      <!-- En-tête avec sélection du type -->
      <div class=" p-6">
        <h2 class="text-blue-200 text-xl font-bold mb-4">Nouveau Champ</h2>
        <select id="fieldTypeSelect" formControlName="fieldType"
          class="w-full px-4 py-2.5 rounded-lg border-2 focus:ring-2 focus:ring-indigo-300">
          <option *ngFor="let type of fieldTypes" [value]="type">
            {{ type | titlecase }}
          </option>
        </select>
      </div>

      <!-- Contenu du formulaire -->
      <div *ngIf="selectedTypeValue" class="p-6 space-y-6">

        <!-- Informations de base -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
            <input type="text" formControlName="name"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Étiquette</label>
            <input type="text" formControlName="label"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Valeur par défaut</label>
            <input type="text" formControlName="defaultValue"
              [disabled]="!(selectedTypeValue == 'text' ||  selectedTypeValue == 'TextArea' || selectedTypeValue == 'date')"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent disabled:bg-gray-100" />
          </div>
        </div>

        <!-- Options (pour select/radio/checkbox) -->
        <div *ngIf="['select', 'radio', 'checkbox'].includes(selectedTypeValue)"
          class="bg-blue-50 border border-blue-200 p-4 rounded-lg">
          <label class="block text-sm font-medium text-gray-700 mb-1">Options (une par ligne)</label>
          <textarea formControlName="optionsList" rows="4"
            class="w-full px-3 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
        </div>

        <!-- Configuration -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Score</label>
            <input type="number" formControlName="score"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Affichage</label>
            <select formControlName="display"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
              <option value="block">Bloc</option>
              <option value="inline">En ligne</option>
            </select>
          </div>

          <div class="flex items-end">
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" formControlName="required"
                class="h-5 w-5 text-indigo-600 rounded border-gray-300 focus:ring-2 focus:ring-indigo-500" />
              <span class="ml-2 text-sm font-medium text-gray-700">Obligatoire</span>
            </label>
          </div>
        </div>

        <!-- Messages et style -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Message d'erreur</label>
          <textarea formControlName="errorMessage" rows="2"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Style personnalisé</label>
          <input type="text" formControlName="customStyle"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent font-mono text-sm" />
        </div>

        <!-- Position dans la grille -->
        <div class="border-t pt-4">
          <h3 class="text-sm font-semibold text-gray-700 mb-3">Position dans la grille</h3>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div>
              <label class="block text-xs text-gray-600 mb-1">Ligne début</label>
              <input type="number" formControlName="rowStart"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-center" />
            </div>
            <div>
              <label class="block text-xs text-gray-600 mb-1">Ligne fin</label>
              <input type="number" formControlName="rowEnd"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-center" />
            </div>
            <div>
              <label class="block text-xs text-gray-600 mb-1">Col début</label>
              <input type="number" formControlName="colStart"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-center" />
            </div>
            <div>
              <label class="block text-xs text-gray-600 mb-1">Col fin</label>
              <input type="number" formControlName="colEnd"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-center" />
            </div>
          </div>
        </div>
      </div>

      <!-- Boutons d'action -->
      <div *ngIf="selectedTypeValue" class="bg-gray-50 px-6 py-4 flex flex-col sm:flex-row justify-end gap-3 border-t">
        <button type="button"
          class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100">
          Annuler
        </button>

        @if (selectedFormElement != null) {
        <button type="button" class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700">
          Supprimer
        </button>
        }
        <button type="submit" [disabled]="pageForm.invalid"
          class="px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
          Ajouter
        </button>
      </div>
    </form>
  </div>
</div>
