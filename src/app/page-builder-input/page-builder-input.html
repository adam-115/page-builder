<div class="min-h-screen bg-gray-100 py-6 px-4">

  <div class="max-w-3xl mx-auto">

    <form [formGroup]="pageForm" (submit)="onSubmit()" class="bg-white rounded-xl shadow-2xl overflow-hidden">

      <div class="p-6 bg-indigo-50 border-b border-indigo-200">
        <h2 class="text-indigo-800 text-2xl font-bold mb-4">✨ Configuration du Nouvel Élément</h2>
        <label for="fieldTypeSelect" class="block text-sm font-semibold text-indigo-700 mb-2">Choisir le Type de Champ</label>
        <select id="fieldTypeSelect" formControlName="fieldType"
          class="w-full px-4 py-2.5 rounded-lg border-2 border-indigo-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition bg-white shadow-sm">
          @for (type of fieldTypes; track type) {
          <option [value]="type">
            {{ type | titlecase }}
          </option>
          }
        </select>
      </div>

      <div *ngIf="selectedTypeValue" class="p-6 space-y-8">

        <div class="space-y-4 pb-4 border-b border-gray-100">
          <h3 class="text-lg font-semibold text-gray-700">Général</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nom (Variable)</label>
              <input type="text" formControlName="name"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Étiquette (Affichage)</label>
              <input type="text" formControlName="label"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
            </div>

            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">Valeur par défaut</label>
              <input type="text" formControlName="defaultValue"
                [disabled]="!(selectedTypeValue === 'text' ||  selectedTypeValue === 'TextArea' || selectedTypeValue === 'date')"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent disabled:bg-gray-100 disabled:text-gray-500 transition" />
            </div>
          </div>
        </div>

        <div *ngIf="['select', 'radio', 'checkbox'].includes(selectedTypeValue)"
          class="bg-blue-50 border border-blue-200 p-4 rounded-lg shadow-inner">
          <h3 class="text-lg font-semibold text-gray-700 mb-3">Options</h3>
          <label class="block text-sm font-medium text-gray-700 mb-1">Liste d'Options (une par ligne)</label>
          <textarea formControlName="optionsList" rows="4"
            class="w-full px-3 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"></textarea>
        </div>

        <div class="space-y-4 pb-4 border-b border-gray-100">
          <h3 class="text-lg font-semibold text-gray-700">Comportement & Validation</h3>

          <div class="grid grid-cols-1 lg:grid-cols-4 sm:grid-cols-4 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Score</label>
              <input type="number" formControlName="score"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Facteur</label>
              <input type="number" formControlName="facteur"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Type Affichage </label>
              <select formControlName="display"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition bg-white">
                <option value="block">Bloc (Vertical)</option>
                <option value="inline">En ligne (Horizontal)</option>
              </select>
            </div>

            <div class="flex items-end">
              <label class="flex items-center cursor-pointer">
                <input type="checkbox" formControlName="required"
                  class="h-5 w-5 text-indigo-600 rounded border-gray-300 focus:ring-2 focus:ring-indigo-500" />
                <span class="ml-2 text-sm font-medium text-gray-700">Champ Obligatoire</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Message d'erreur de validation</label>
            <textarea formControlName="errorMessage" rows="2"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"></textarea>
          </div>
        </div>

        <div class="space-y-4">
          <h3 class="text-lg font-semibold text-gray-700">Mise en page & Style</h3>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Style Personnalisé (Classes CSS)</label>
            <input type="text" formControlName="customStyle" placeholder="Ex: text-xl font-bold bg-yellow-100"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent font-mono text-sm transition" />
          </div>

          <div class="border-t pt-4">
            <h4 class="text-base font-semibold text-gray-700 mb-3">Position dans la Grille (CSS Grid)</h4>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div>
                <label class="block text-xs text-gray-600 mb-1">Ligne début</label>
                <input type="number" formControlName="rowStart"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-center transition" />
              </div>
              <div>
                <label class="block text-xs text-gray-600 mb-1">Ligne fin</label>
                <input type="number" formControlName="rowEnd"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-center transition" />
              </div>
              <div>
                <label class="block text-xs text-gray-600 mb-1">Col début</label>
                <input type="number" formControlName="colStart"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-center transition" />
              </div>
              <div>
                <label class="block text-xs text-gray-600 mb-1">Col fin</label>
                <input type="number" formControlName="colEnd"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-center transition" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="selectedTypeValue" class="bg-gray-50 px-6 py-4 flex flex-col sm:flex-row justify-end gap-3 border-t">
        <button type="button"
          class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg shadow-sm hover:bg-gray-100 transition">
          Annuler
        </button>

        @if (selectedFormElement != null) {
        <button type="button" (click)="deleteFromElement()"  class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 rounded-lg shadow-sm hover:bg-red-700 transition">
          🗑️ Supprimer
        </button>
        }
        <button type="submit" [disabled]="pageForm.invalid"
          class="px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-lg shadow-md hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition">
          ➕ Ajouter / Mettre à jour
        </button>
      </div>
    </form>

  </div>

</div>
